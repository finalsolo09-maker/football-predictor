name: Run Football Prediction Pipeline

on:
  schedule:
    - cron: '0 0 * * *' # 매일 자정(UTC 기준) 자동 실행
  workflow_dispatch:     # 깃허브 웹에서 수동으로 즉시 실행 버튼 클릭 가능

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: 깃허브 소스 코드 체크아웃
        uses: actions/checkout@v3

      - name: 파이썬 3.10 환경 설정
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 필수 패키지 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 메인 예측 파이프라인 실행
        run: |
          python main.py

      - name: 변경된 SQLite 데이터베이스 깃허브에 자동 커밋 & 푸시
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add data/predictions.db
          git commit -m "Auto-update prediction database: $(date +'%Y-%m-%d')" || exit 0
          git push
