name: Daily Football Pipeline Automation

on:
  schedule:
    - cron: '0 15 * * *' # 매일 15:00 UTC (한국 시간 기준 자정 00:00) 실행
  workflow_dispatch: # 깃허브 웹 화면에서 버튼을 눌러 즉시 실행 가능하도록 설정

jobs:
  build-and-run:
    runs-on: ubuntu-latest

    steps:
      - name: 저장소 코드 불러오기
        uses: actions/checkout@v3

      - name: 파이썬 3.10 환경 설정
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 의존성 패키지 자동 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 파이프라인 메인 코드 실행 (데이터 수집 & DB 업데이트)
        run: |
          python main.py

      - name: 변경된 데이터베이스(SQLite) 깃허브 저장소에 자동 커밋 및 푸시
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add data/predictions.db
          git commit -m "Auto Update: Daily Predictions DB [$(date +'%Y-%m-%d')]" || exit 0
          git push
